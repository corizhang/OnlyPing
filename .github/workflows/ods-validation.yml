name: ONLYTOOLS Standard Validation
on:
  pull_request:
    paths:
      - 'onlytools.config.json'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'scripts/check_product_version.py'
      - '.github/workflows/ods-validation.yml'
      - 'package.json'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate product metadata and version
        run: |
          python -m json.tool onlytools.config.json > /dev/null
          python scripts/check_product_version.py --version "$(node -p 'require("./package.json").version')"
      - name: Validate changelog structure
        run: |
          python - <<'PY'
          from pathlib import Path
          body = Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert "## [Unreleased]" in body
          assert "{{" not in body
          print("CHANGELOG structure OK")
          PY
